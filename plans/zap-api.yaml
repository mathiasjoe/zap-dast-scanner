# ZAP Automation Framework-plan: API-skann med OpenAPI-import og bearer-token.
#
# Kjøres av scripts/run-api.sh, som setter miljøvariablene (${...}) og henter
# token rett før skannet. Token sendes inn som miljøvariabel og lagres aldri.
#
# Dokumentasjon: https://www.zaproxy.org/docs/desktop/addons/automation-framework/

env:
  contexts:
    - name: api
      urls:
        - ${API_BASE}            # alt under denne URL-en er i scope, ingenting annet
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # Legger Authorization-header på alle forespørsler ZAP sender.
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: BearerToken
        matchType: req_header
        matchString: Authorization
        matchRegex: false
        replacement: "Bearer ${TOKEN}"
        tokenProcessing: false

  # Importerer OpenAPI-spec og legger alle endepunkter i sites-treet.
  - type: openapi
    parameters:
      apiUrl: ${OPENAPI_SPEC_URL}
      targetUrl: ${API_BASE}     # overstyrer host/basePath i spec-en
      context: api

  - type: activeScan
    parameters:
      context: api
      maxScanDurationInMins: 120
    policyDefinition:
      rules:
        - id: 40026              # DOM XSS: irrelevant for API og starter nettleser (OOM i Docker)
          threshold: off

  # Rapporter. SARIF-filen lastes opp til GitHub code scanning av workflowen.
  - type: report
    parameters:
      template: sarif-json
      reportDir: ${ZAP_REPORT_DIR}
      reportFile: zap-report.sarif
  - type: report
    parameters:
      template: traditional-html
      reportDir: ${ZAP_REPORT_DIR}
      reportFile: zap-report
      reportTitle: "ZAP API scan"
  - type: report
    parameters:
      template: traditional-json
      reportDir: ${ZAP_REPORT_DIR}
      reportFile: zap-report

  # Exit-kode 1 ved funn på dette nivået eller høyere: info | low | medium | high
  - type: exitStatus
    parameters:
      errorLevel: ${ZAP_FAIL_ON}

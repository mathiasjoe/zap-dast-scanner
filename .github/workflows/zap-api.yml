# ZAP API-skann i GitHub Actions. Funnene havner under Security -> Code scanning.
#
# Variabler (Settings -> Secrets and variables -> Actions -> Variables):
#   API_PROJECT, API_BASE, OPENAPI_SPEC_URL, TOKEN_URL
#   ZAP_FAIL_ON (valgfri, standard high)
#   TEAM og ZAP_STORAGE_ACCOUNT (valgfrie, kun hvis rapportene også skal til Azure Blob Storage)
# Secrets:
#   TOKEN_BASIC_AUTH
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (kun med Blob Storage)

name: ZAP API scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"   # mandag 02:00 UTC

permissions:
  contents: read
  security-events: write   # upload-sarif til code scanning
  actions: read            # trengs av upload-sarif i private repoer
  id-token: write          # azure/login med OIDC (kun med Blob Storage)

env:
  ZAP_DIR: .               # mappa blueprinten ligger i, f.eks. "zap" hvis den er en undermappe

jobs:
  api-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Logg inn i Azure
        if: vars.ZAP_STORAGE_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Kjør API-skann
        working-directory: ${{ env.ZAP_DIR }}
        run: bash scripts/run-api.sh
        env:
          API_PROJECT: ${{ vars.API_PROJECT }}
          API_BASE: ${{ vars.API_BASE }}
          OPENAPI_SPEC_URL: ${{ vars.OPENAPI_SPEC_URL }}
          TOKEN_URL: ${{ vars.TOKEN_URL }}
          TOKEN_BASIC_AUTH: ${{ secrets.TOKEN_BASIC_AUTH }}
          ZAP_FAIL_ON: ${{ vars.ZAP_FAIL_ON || 'high' }}
          TEAM: ${{ vars.TEAM }}
          ZAP_STORAGE_ACCOUNT: ${{ vars.ZAP_STORAGE_ACCOUNT }}

      # Kjører også når skannet feiler på funn. Funnene vises under Security -> Code scanning.
      - name: Last opp funn til GitHub code scanning
        if: always() && hashFiles(format('{0}/{1}/zap-report.sarif', env.ZAP_DIR, env.ZAP_REPORT_DIR)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.ZAP_DIR }}/${{ env.ZAP_REPORT_DIR }}/zap-report.sarif
          category: zap-api

      - name: Rapport som artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-report
          path: ${{ env.ZAP_DIR }}/zap-output/
          if-no-files-found: warn

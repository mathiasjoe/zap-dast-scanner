# Eksempel for Azure DevOps. Tilsvarer .github/workflows/zap-api.yml, men uten opplasting
# til code scanning (det finnes bare i GitHub). Rapportene publiseres som pipeline-artifact.
#
# Variabelgruppen zap-secrets (gjerne koblet til Key Vault) må inneholde:
#   API_PROJECT, API_BASE, OPENAPI_SPEC_URL, TOKEN_URL, TOKEN_BASIC_AUTH (secret)

trigger: none

schedules:
  - cron: "0 2 * * 1"
    displayName: "Weekly API ZAP scan"
    branches:
      include:
        - main
    always: true

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: zap-secrets

steps:
  - checkout: self

  - script: bash scripts/run-api.sh
    displayName: "Run API scan"
    env:
      API_PROJECT: $(API_PROJECT)
      API_BASE: $(API_BASE)
      OPENAPI_SPEC_URL: $(OPENAPI_SPEC_URL)
      TOKEN_URL: $(TOKEN_URL)
      TOKEN_BASIC_AUTH: $(TOKEN_BASIC_AUTH)

  - publish: zap-output
    artifact: zap-output
    displayName: "Publish scan artifacts (reports)"
    condition: always()
